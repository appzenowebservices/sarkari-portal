# Production compose for sarkari-portal.
# `.env` (same directory) provides values for BOTH build.args and the container.
# Required in `.env`: DATABASE_URL, AUTH_SECRET, NEXT_PUBLIC_SITE_URL
services:
  web:
    build:
      context: .
      args:
        DATABASE_URL: ${DATABASE_URL:-}
        AUTH_SECRET: ${AUTH_SECRET:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        SKIP_ENV_VALIDATION: ${SKIP_ENV_VALIDATION:-}
    image: sarkari-portal:latest
    container_name: sarkari-portal-web
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    # Guard against thread-exhaustion crashes on small boxes
    # ("pthread_create: Resource temporarily unavailable").
    pids_limit: 4096
